<div class="tags-view-container">
  <div class="tags-view-wrapper">
    @for (view of views(); track view.path) {
      <span class="tags-view-item" [class.tag-active]="isActive(view)" (click)="go(view)">
        {{ view.title }}
        @if (view.closable) {
          <nz-icon nzType="close" class="tag-close" (click)="close($event, view)" />
        }
      </span>
    }
  </div>

  <div class="tags-view-actions">
    <a nz-dropdown [nzDropdownMenu]="tagMenu" nzPlacement="bottomRight">
      <nz-icon nzType="more" />
    </a>
    <nz-dropdown-menu #tagMenu="nzDropdownMenu">
      <ul nz-menu>
        <li nz-menu-item (click)="refresh()">刷新当前</li>
        <li nz-menu-item (click)="closeOthers()">关闭其他</li>
        <li nz-menu-item (click)="closeAll()">关闭全部</li>
      </ul>
    </nz-dropdown-menu>
  </div>
</div>
