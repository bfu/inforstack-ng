<div class="login-page">
  <div class="login-card">
    <h3 class="title">{{ title }}</h3>
    <form nz-form [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-control nzErrorTip="请输入您的账号">
          <nz-input-group nzPrefixIcon="user">
            <input type="text" nz-input formControlName="username" placeholder="账号" autocomplete="off" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-control nzErrorTip="请输入您的密码">
          <nz-input-group nzPrefixIcon="lock">
            <input
              type="password"
              nz-input
              formControlName="password"
              placeholder="密码"
              autocomplete="off"
            />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      @if (captchaEnabled()) {
        <nz-form-item>
          <nz-form-control nzErrorTip="请输入验证码">
            <div class="code-row">
              <nz-input-group nzPrefixIcon="safety-certificate" class="code-input">
                <input
                  type="text"
                  nz-input
                  formControlName="code"
                  placeholder="验证码"
                  autocomplete="off"
                />
              </nz-input-group>
              <img class="code-img" [src]="codeUrl()" alt="验证码" title="点击刷新" (click)="getCode()" />
            </div>
          </nz-form-control>
        </nz-form-item>
      }

      <nz-form-item>
        <label nz-checkbox formControlName="rememberMe">记住账号</label>
      </nz-form-item>

      <nz-form-item>
        <button nz-button nzType="primary" nzSize="large" nzBlock type="submit" [nzLoading]="loading()">
          {{ loading() ? '登 录 中...' : '登 录' }}
        </button>
      </nz-form-item>

      @if (registerEnabled) {
        <div class="register-link">
          <a routerLink="/register">立即注册</a>
        </div>
      }
    </form>
  </div>

  <div class="login-footer">
    <span>{{ footerContent }}</span>
  </div>
</div>
